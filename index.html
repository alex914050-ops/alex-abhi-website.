<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Abhi Kumar - Personal Website</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      background: linear-gradient(135deg, #111827, #1f2937);
      color: white;
      text-align: center;
      min-height: 100vh;
    }

    .container {
      max-width: 600px;
      margin: auto;
      padding: 50px 20px;
    }

    .profile {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      margin-bottom: 20px;
      border: 4px solid white;
      object-fit: cover;
    }

    h1 {
      font-size: 32px;
      margin-bottom: 10px;
    }

    .bio {
      color: #d1d5db;
      font-size: 17px;
      margin-bottom: 30px;
    }

    .button {
      display: block;
      background: white;
      color: #111827;
      text-decoration: none;
      padding: 15px;
      margin: 15px 0;
      border-radius: 12px;
      font-weight: bold;
      transition: 0.3s;
    }

    .button:hover {
      transform: scale(1.03);
    }

    footer {
      margin-top: 40px;
      color: #9ca3af;
      font-size: 14px;
    }
  </style>
</head>

<body>

  <div class="container">

    <img
      class="profile"
      src="https://via.placeholder.com/120"
      alt="Profile Photo"
    >

    <h1>Abhi Kumar</h1>

    <p class="bio">
      Welcome to my personal website ❤️<br>
      Creator • Blogger • Digital Creator
    </p>

    <a class="button" href="https://www.instagram.com/" target="_blank">
      📸 Instagram
    </a>

    <a class="button" href="https://www.youtube.com/" target="_blank">
      ▶️ YouTube
    </a>

    <a class="button" href="https://www.facebook.com/" target="_blank">
      👍 Facebook
    </a>

    <footer>
      © 2026 Abhi Kumar • All Rights Reserved
    </footer>

<a href="https://www.instagram.com/alex_dancer.07/" target="_blank">
  📸 Instagram
</a>  </div>

</body>
</html>
